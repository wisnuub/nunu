name: Release

on:
  push:
    tags:
      - 'alpha-v*'
      - 'v*'

jobs:
  build-mac:
    name: Build macOS (native)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build nunu.app and DMG
        working-directory: macos
        run: scripts/build-app.sh --dmg

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: nunu-mac
          path: macos/build/nunu-*-arm64.dmg

  build-win:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Write Google credentials
        run: |
          New-Item -ItemType Directory -Force -Path native\credentials
          '{"clientId":"${{ secrets.GOOGLE_CLIENT_ID }}","clientSecret":"${{ secrets.GOOGLE_CLIENT_SECRET }}"}' | Out-File -FilePath native\credentials\google.json -Encoding utf8

      - name: Install npm dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build

      # Windows: package without bundled AVM (not yet tested on Windows)
      # Temporarily override electron-builder config to skip AVM extraResources
      - name: Package (Windows)
        run: |
          npx electron-builder --win --publish never --config.win.extraResources=[]
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: nunu-win
          path: release/*.exe

  release:
    name: Create Release
    needs: [build-mac, build-win]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: nunu-mac
          path: artifacts/mac

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: nunu-win
          path: artifacts/win

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: true
          body: |
            ## nunu ${{ github.ref_name }}

            ### Platform status
            | Platform | Status |
            |---|---|
            | macOS (Apple Silicon) | Native Swift app, Android 14 with Google Play |
            | Windows | Launcher UI only, emulator coming soon |

            ### Download
            - **macOS (Apple Silicon)**: `.dmg`, drag nunu to Applications
            - **Windows**: `.exe` installer

            ### First run (macOS)
            1. Open nunu and accept the Android SDK licenses
            2. nunu downloads the Android VM engine and the Android 14 Google Play image (about 1.9 GB)
            3. Android boots in about 30 seconds; after that it resumes in a few seconds

            ### Notes
            - macOS: right-click → Open on first launch if Gatekeeper blocks it
            - Windows: click "More info → Run anyway" if SmartScreen appears
          files: |
            artifacts/mac/*.dmg
            artifacts/win/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
